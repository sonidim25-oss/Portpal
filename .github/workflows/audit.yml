name: Dependency audit

# Lightweight monthly audit: read-only, no secrets, no auto-merge.
# Findings are triaged by a human per docs/dependency-audit.md.

on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          node -e "
            const pkg = require('./package.json').version;
            const conf = require('./src-tauri/tauri.conf.json').version;
            const fs = require('fs');
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*\"([^\"]+)\"/m)[1];
            console.log('package.json:', pkg, '| tauri.conf.json:', conf, '| Cargo.toml:', cargo);
            if (pkg !== conf || pkg !== cargo) { console.error('Version mismatch!'); process.exit(1); }
          "

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (frontend)
        run: npm audit --audit-level=moderate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (src-tauri)
        working-directory: src-tauri
        run: cargo audit
