name: Hygiene

# Formatting and lint gates. All three fail the run.
#
# Clippy is `-D warnings`: the tree is clean, so any new warning is a
# regression rather than pre-existing noise. The backlog that kept it advisory
# is gone — zombie_processes (a test that dropped its helper Child unwaited),
# dead_code (one unused accessor deleted, one made test-only), and
# type_complexity (a five-field tuple that now has a name, logger::PortSnapshot).
#
# One lint is allowed in place rather than obeyed: needless_return in
# scanner::resolve_external_tool, where the cfg-gated Windows arm must return
# so the Unix block below it stays reachable. The rationale is at the call site.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

  rust-hygiene:
    # Windows: Tauri's Linux system dependencies (glib-sys, gobject-sys, …)
    # are not installed on ubuntu-latest, so a compile-based lint cannot run
    # there without apt-installing GTK. Windows needs no extra setup
    # (see build.yml) and matches the primary dev environment.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
