[package]
name = "portpal"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portpal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
window-vibrancy = "0.5"
sysinfo = "0.30"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

# Kill on Windows goes through a process handle rather than a PID, so the PID
# cannot be recycled between validating a process and terminating it. Only the
# two modules that declare OpenProcess/TerminateProcess/WaitForSingleObject and
# CloseHandle are enabled; the crate is already in the dependency tree via
# tauri/sysinfo, so this adds no new supply-chain surface.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

